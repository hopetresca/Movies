<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simplified Movies API ref</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">
            <img src="assets/fes-logo.png" alt class="logo__img">
            <div class="logo__title">
                <span>Simplified</span> flix
            </div>
        </div>
        <form class="search-form" id="searchForm">
            <div class="search-form__group">
                <input class="search-form__input" type="text" id="searchInput" placeholder="Search Movies..." required>
                <button class="search-form__button">Search</button>
            </div>
        </form>
    </nav>
    <main>
        <div class="controls">
            <p id="resultsInfo" class="resultsInfo">
                <span>Showing</span> "horror"
            </p>
            <div>
                <label for="sortSelect">Sort By:</label>
                <select id="sortSelect">
                    <option value="default" disabled selected>Sort</option>
                    <option value="asc">A - Z</option>
                    <option value="desc">Z - A</option>
                    <option value="newest">Newest</option>
                    <option value="oldest">Oldest</option>
                </select>
            </div>
        </div>
        <div id="movie-grid" class="movieGrid">
            <div class="movie-card">
                <div class="poster">
                    <img src="https://m.media-amazon.com/images/M/MV5BNTM3NTZjMDctYWQ3YS00NjQ4LWIwMjItNmIwZTlkM2U4NjRkXkEyXkFqcGc@._V1_QL75_UY562_CR35,0,380,562_.jpg">
                    <img src="movie-poster-url" alt="Movie Poster" onerror="this.parentNode.innerHTML='<p>Movie Poster Unavailable</p>';" />
                </div>
                <div class="movie-info">
                    <h2 class="movie-card__title">
                        Movie Title
                    </h2>
                    <p class="movie-card__year">
                        Year
                    </p>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p>
            Copyright &copy; 2026. Powered by OMDBapi.
        </p>
        <script src="index.js"></script>
    </footer>
</body>
</html>
